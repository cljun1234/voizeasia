<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Directory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --primary-color: #ffd700;
            --primary-hover: #e6c200;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --card-bg: rgba(30, 30, 30, 0.8);
            --card-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }

        .navbar {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .register-btn {
            padding: 10px 20px;
            background: var(--primary-color);
            color: #000;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .register-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header-section {
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
        }

        .filters-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        select {
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            cursor: pointer;
            min-width: 150px;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        .creators-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .creator-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .creator-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 215, 0, 0.3);
        }

        .card-image-container {
            width: 100%;
            height: 280px;
            overflow: hidden;
            position: relative;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .creator-card:hover .card-image {
            transform: scale(1.05);
        }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .creator-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .creator-handle {
            color: var(--primary-color);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge.niche {
            background: rgba(255, 215, 0, 0.1);
            color: var(--primary-color);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .badge.language {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .bio-preview {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }

        .social-links {
            display: flex;
            gap: 12px;
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--card-border);
        }

        .social-link {
            color: var(--text-main);
            text-decoration: none;
            font-size: 14px;
            opacity: 0.7;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .social-link:hover {
            opacity: 1;
            color: var(--primary-color);
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 18px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px dashed var(--card-border);
        }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--primary-color);
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }
            .filters-container {
                flex-direction: column;
            }
            select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">KOL Connect</a>
        <a href="/register.html" class="register-btn">Join as Creator</a>
    </nav>

    <div class="container">
        <div class="header-section">
            <h1>Discover Creators</h1>

            <div class="filters-container">
                <div class="filter-group">
                    <label for="nicheFilter">Niche</label>
                    <select id="nicheFilter">
                        <option value="all">All Niches</option>
                        <option value="Travel">Travel</option>
                        <option value="Lifestyle">Lifestyle</option>
                        <option value="Foodie">Foodie</option>
                        <option value="Fashion">Fashion</option>
                        <option value="Beauty">Beauty</option>
                        <option value="Fitness">Fitness</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Education">Education</option>
                        <option value="Others">Others</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="languageFilter">Language</label>
                    <select id="languageFilter">
                        <option value="all">All Languages</option>
                        <option value="Malay">Malay</option>
                        <option value="English">English</option>
                        <option value="Mandarin">Mandarin</option>
                        <option value="Mixed">Mixed</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="creators-grid" id="creatorsGrid">
            <div class="loading">Loading creators...</div>
        </div>
    </div>

    <script>
        let allCreators = [];

        // DOM Elements
        const grid = document.getElementById('creatorsGrid');
        const nicheFilter = document.getElementById('nicheFilter');
        const languageFilter = document.getElementById('languageFilter');

        // Fetch data
        async function fetchCreators() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Failed to load data');

                allCreators = await response.json();
                renderCreators(allCreators);
            } catch (error) {
                console.error("Error loading creators:", error);
                grid.innerHTML = `<div class="no-results">Failed to load creators. Please try again later.</div>`;
            }
        }

        // Render cards
        function renderCreators(creators) {
            grid.innerHTML = '';

            if (creators.length === 0) {
                grid.innerHTML = `<div class="no-results">No creators found matching your filters.</div>`;
                return;
            }

            creators.forEach(creator => {
                const card = document.createElement('div');
                card.className = 'creator-card';

                // Generate badges
                let badgesHtml = '';
                creator.nicheCategories.forEach(niche => {
                    badgesHtml += `<span class="badge niche">${niche}</span>`;
                });
                creator.languages.forEach(lang => {
                    badgesHtml += `<span class="badge language">${lang}</span>`;
                });

                card.innerHTML = `
                    <div class="card-image-container">
                        <img src="${creator.profileImageUrl}" alt="${creator.fullName}" class="card-image" loading="lazy">
                    </div>
                    <div class="card-content">
                        <h3 class="creator-name">${creator.fullName}</h3>
                        <div class="creator-handle">${creator.creatorName}</div>

                        <div class="badges">
                            ${badgesHtml}
                        </div>

                        <p class="bio-preview">${creator.bio}</p>

                        <div class="social-links">
                            ${creator.tiktokLink ? `<a href="${creator.tiktokLink}" target="_blank" class="social-link">TikTok</a>` : ''}
                            ${creator.instagramLink ? `<a href="${creator.instagramLink}" target="_blank" class="social-link">Instagram</a>` : ''}
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Filter logic
        function applyFilters() {
            const selectedNiche = nicheFilter.value;
            const selectedLanguage = languageFilter.value;

            const filtered = allCreators.filter(creator => {
                const matchNiche = selectedNiche === 'all' || creator.nicheCategories.includes(selectedNiche);
                const matchLanguage = selectedLanguage === 'all' || creator.languages.includes(selectedLanguage);

                return matchNiche && matchLanguage;
            });

            renderCreators(filtered);
        }

        // Event Listeners
        nicheFilter.addEventListener('change', applyFilters);
        languageFilter.addEventListener('change', applyFilters);

        // Initialize
        document.addEventListener('DOMContentLoaded', fetchCreators);
    </script>
</body>
</html>
